[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hy3-algotrace-lab"
version = "0.1.0"
description = "Personal Hy3 AlgoTrace Lab activity project for algorithm-solution auditing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "streamlit>=1.39",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hy3_algotrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker_integration: requires a real Docker daemon and immutable Judge build inputs",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# Local single-user Compose only. docker compose config must render local-only ports.
services:
  api:
    image: hy3-algotrace-local:dev
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        HY3_APP_RUNTIME_IMAGE: ${HY3_APP_RUNTIME_IMAGE:?Set a locked runtime repository@sha256 image.}
        HY3_DOCKER_CLI_PACKAGE: ${HY3_DOCKER_CLI_PACKAGE:?Set an exact docker.io=VERSION package.}
    environment:
      HY3_ARTIFACT_ROOT: /artifacts/runs
      HY3_CATALOG_ROOT: /data/problems
      HY3_BASE_URL: ${HY3_BASE_URL:?Set the authorised Hy3 endpoint URL locally.}
      HY3_API_KEY: ${HY3_API_KEY:?Set the authorised Hy3 credential locally.}
      HY3_MODEL: ${HY3_MODEL:?Set the authorised Hy3 model identifier locally.}
      HY3_JUDGE_IMAGE: ${HY3_JUDGE_IMAGE:?Set an immutable repository@sha256 Judge image.}
      HY3_BACKGROUND_WORKERS: ${HY3_BACKGROUND_WORKERS:-2}
      HY3_CODE_REVISION: ${HY3_CODE_REVISION:-unknown}
    volumes:
      - hy3_artifacts:/artifacts
      - type: bind
        source: ${HY3_CATALOG_ROOT_HOST:?Set an absolute trusted formal-catalog directory.}
        target: /data/problems
        read_only: true
      - type: bind
        source: ${HY3_DOCKER_SOCKET_PATH:?Set the controlled local Docker socket path.}
        target: /var/run/docker.sock
    command:
      ["python", "-m", "uvicorn", "hy3_algotrace.local_app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${HY3_API_PORT:-8000}:8000"

  streamlit:
    profiles: ["ui"]
    image: hy3-algotrace-local:dev
    environment:
      HY3_API_BASE_URL: http://api:8000
    command:
      ["streamlit", "run", "/opt/hy3-algotrace/src/hy3_algotrace/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "127.0.0.1:${HY3_UI_PORT:-8501}:8501"
    depends_on:
      - api

  formal-readiness:
    profiles: ["formal-readiness"]
    image: hy3-algotrace-local:dev
    environment:
      HY3_FORMAL_VALIDATION_FORMAT: ${HY3_FORMAL_VALIDATION_FORMAT:?Set the pinned validation format.}
      HY3_FORMAL_TEST_FORMAT: ${HY3_FORMAL_TEST_FORMAT:?Set the pinned test format.}
    volumes:
      - type: bind
        source: ${HY3_FORMAL_INPUT_ROOT_HOST:?Set the trusted complete formal-input directory.}
        target: /formal-inputs
        read_only: true
      - type: bind
        source: ${HY3_FORMAL_OUTPUT_ROOT_HOST:?Set an existing create-only output directory.}
        target: /formal-output
    command:
      - python
      - -m
      - hy3_algotrace.formal_qualification
      - --selection
      - /formal-inputs/selection.json
      - --acquisition
      - /formal-inputs/acquisition.json
      - --acquisition-validation
      - /formal-inputs/acquisition-validation.json
      - --validation-raw
      - /formal-inputs/validation.raw
      - --test-raw
      - /formal-inputs/test.raw
      - --validation-format
      - ${HY3_FORMAL_VALIDATION_FORMAT}
      - --test-format
      - ${HY3_FORMAL_TEST_FORMAT}
      - --validation-reviews
      - /formal-inputs/validation-reviews.json
      - --test-reviews
      - /formal-inputs/test-reviews.json
      - --review-manifest
      - /formal-inputs/review-manifest.json
      - --bundles
      - /formal-inputs/bundles.json
      - --corpus
      - /formal-inputs/corpus.json
      - --data-root
      - /formal-inputs/data
      - --judge-cases
      - /formal-inputs/judge-cases.json
      - --judge-report
      - /formal-inputs/judge-evidence.json
      - --judge-raw-evidence
      - /formal-inputs/judge-raw-evidence.json
      - --candidate
      - /formal-inputs/benchmark/benchmarks/${HY3_FORMAL_BENCHMARK_ID:?Set the formal benchmark ID.}/formal-candidate.json
      - --benchmark-root
      - /formal-inputs/benchmark
      - --output-root
      - /formal-output

volumes:
  hy3_artifacts:

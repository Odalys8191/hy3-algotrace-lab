name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff format --check src/hy3_algotrace/release_validation.py src/hy3_algotrace/demo_cli.py src/hy3_algotrace/local_app.py docker/verify-runtime-lock.py tests/test_release_validation.py tests/test_demo_cli.py tests/test_local_release_wiring.py
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python -m pytest -q tests/test_api.py
      - run: python -m hy3_algotrace.release_validation --root .
      - name: Report formal-data readiness honestly
        run: |
          set +e
          scripts/formal-readiness.sh
          result=$?
          test "$result" -eq 3

  docker:
    if: >-
      ${{ vars.HY3_APP_RUNTIME_IMAGE != '' && vars.HY3_DOCKER_CLI_PACKAGE != '' &&
      vars.HY3_JUDGE_IMAGE != '' && vars.HY3_JUDGE_VALIDATOR_IMAGE != '' &&
      vars.HY3_JUDGE_BASE_IMAGE != '' && vars.HY3_JUDGE_TIME_PACKAGE != '' &&
      vars.HY3_JUDGE_UTIL_LINUX_PACKAGE != '' }}
    runs-on: ubuntu-latest
    env:
      HY3_APP_RUNTIME_IMAGE: ${{ vars.HY3_APP_RUNTIME_IMAGE }}
      HY3_DOCKER_CLI_PACKAGE: ${{ vars.HY3_DOCKER_CLI_PACKAGE }}
      HY3_JUDGE_IMAGE: ${{ vars.HY3_JUDGE_IMAGE }}
      HY3_JUDGE_VALIDATOR_IMAGE: ${{ vars.HY3_JUDGE_VALIDATOR_IMAGE }}
      HY3_JUDGE_BASE_IMAGE: ${{ vars.HY3_JUDGE_BASE_IMAGE }}
      HY3_JUDGE_TIME_PACKAGE: ${{ vars.HY3_JUDGE_TIME_PACKAGE }}
      HY3_JUDGE_UTIL_LINUX_PACKAGE: ${{ vars.HY3_JUDGE_UTIL_LINUX_PACKAGE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Build both pinned images and run local-only Compose/API smoke checks
        run: scripts/docker-smoke.sh

  docker-release-not-ready:
    if: >-
      ${{ vars.HY3_APP_RUNTIME_IMAGE == '' || vars.HY3_DOCKER_CLI_PACKAGE == '' ||
      vars.HY3_JUDGE_IMAGE == '' || vars.HY3_JUDGE_VALIDATOR_IMAGE == '' ||
      vars.HY3_JUDGE_BASE_IMAGE == '' || vars.HY3_JUDGE_TIME_PACKAGE == '' ||
      vars.HY3_JUDGE_UTIL_LINUX_PACKAGE == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a green release without pinned Docker inputs
        run: |
          echo "Docker release verification is NOT READY: configure the documented immutable image/package repository Variables."
          exit 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
